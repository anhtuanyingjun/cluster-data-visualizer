<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#1A4F7A">
  <title>Cluster Data Visualizer</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("cluster-theme");
        var d = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (d) document.documentElement.classList.add("dark");
        if (localStorage.getItem("cluster-lang") === "zh-Hant") document.documentElement.lang = "zh-Hant";
        var c = localStorage.getItem("cluster-accent");
        if (c && /^#[0-9a-fA-F]{6}$/.test(c)) {
          function hsl(h,s,l){s/=100;l/=100;var a=s*Math.min(l,1-l);function f(n){var k=(n+h/30)%12;return l-a*Math.max(Math.min(k-3,9-k,1),-1)}return"#"+[f(0),f(8),f(4)].map(function(v){return Math.round(v*255).toString(16).padStart(2,"0")}).join("")}
          function toHsl(hex){var n=parseInt(hex.slice(1),16),r=((n>>16)&255)/255,g=((n>>8)&255)/255,b=(n&255)/255,max=Math.max(r,g,b),min=Math.min(r,g,b),l=(max+min)/2,d=max-min,h=0,s=0;if(d){s=d/(1-Math.abs(2*l-1));h=max===r?((g-b)/d)%6:max===g?(b-r)/d+2:(r-g)/d+4;h*=60;if(h<0)h+=360}return{h:h,s:s*100,l:l*100}}
          function y(hex){var n=parseInt(hex.slice(1),16);return(((n>>16)&255)*299+((n>>8)&255)*587+(n&255)*114)/1000}
          var o=toHsl(c),soft=Math.min(o.s,36),dark=d,primary;
          if(!dark) primary=o.s<8?hsl(o.h,0,30):hsl(o.h,Math.min(Math.max(o.s,38),74),o.l<24?32:o.l>50?38:o.l);
          else primary=o.s<8?hsl(o.h,0,74):hsl(o.h,Math.min(Math.max(o.s*0.8,28),58),o.l>80?70:o.l<58?68:o.l);
          var fg=y(primary)>158?"#1c1916":"#f7f5f2";
          var map=dark?{"--bg":hsl(o.h,Math.min(soft,20),8),"--surface":hsl(o.h,Math.min(soft,16),12),"--wash":hsl(o.h,Math.min(soft,14),17),"--ink":hsl(o.h,Math.min(soft*0.3,12),93),"--muted":hsl(o.h,Math.min(soft*0.22,10),74),"--subtle":hsl(o.h,Math.min(soft*0.16,8),62),"--line":hsl(o.h,Math.min(soft,12),27),"--hover":hsl(o.h,Math.min(soft,16),18),"--active":hsl(o.h,Math.min(soft,18),22),"--dup":hsl((o.h+52)%360,16,22)}:{"--bg":hsl(o.h,soft*0.75,92),"--surface":hsl(o.h,soft*0.4,97.5),"--wash":hsl(o.h,soft*0.85,86.5),"--ink":hsl(o.h,Math.min(soft,20),15),"--muted":hsl(o.h,Math.min(soft*0.4,14),35),"--subtle":hsl(o.h,Math.min(soft*0.28,10),47),"--line":hsl(o.h,soft*0.5,76),"--hover":hsl(o.h,soft*0.7,89.5),"--active":hsl(o.h,soft*0.8,83),"--dup":hsl((o.h+52)%360,26,88)};
          var st=document.documentElement.style;
          Object.keys(map).forEach(function(k){st.setProperty(k,map[k])});
          st.setProperty("--primary",primary);
          st.setProperty("--primary-fg",fg);
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <header class="hero">
      <div>
        <h1 data-i18n="title">Cluster Data Visualizer</h1>
        <p class="lede" data-i18n="lede">Paste a cluster report, shape the table, and export. Nothing leaves the browser.</p>
      </div>
      <div class="header-actions">
        <div class="lang-switch" role="group" aria-label="Language">
          <button type="button" id="lang-en" aria-pressed="true" onclick="setLang('en')">EN</button>
          <button type="button" id="lang-zh" aria-pressed="false" onclick="setLang('zh-Hant')">繁</button>
        </div>
        <div class="accent" id="accentPicker">
          <button class="btn btn-icon" id="accentBtn" type="button" onclick="toggleAccent(event)" data-i18n-aria="accent" aria-label="Interface color">
            <span class="swatch" id="accentSwatch"></span>
          </button>
          <div class="accent-pop" id="accentPop">
            <div class="swatches" id="accentSwatches"></div>
            <label class="accent-code">
              <input type="color" id="accentColor" value="#1a4f7a" aria-label="Color code" oninput="setAccent(this.value)">
              <input type="text" id="accentHex" maxlength="7" spellcheck="false" value="#1A4F7A" aria-label="Color code" oninput="typeAccent(this.value)">
            </label>
            <button class="btn btn-text" type="button" onclick="resetAccent()" data-i18n="resetColor">Default</button>
          </div>
        </div>
        <button class="btn btn-icon" id="themeToggle" type="button" onclick="toggleTheme()" aria-label="Switch theme"></button>
      </div>
    </header>

    <section class="panel">
      <div class="format-row">
        <span class="panel-label" data-i18n="format" style="margin:0">Format</span>
        <div class="lang-switch" role="group" aria-label="Format">
          <button type="button" id="fmt-xj" aria-pressed="true" onclick="setFormat('xjview')">xjView</button>
          <button type="button" id="fmt-cat" aria-pressed="false" onclick="setFormat('cat12')">CAT12</button>
          <button type="button" id="fmt-both" aria-pressed="false" onclick="setFormat('both')" data-i18n="formatBoth">Both</button>
        </div>
      </div>
      <div id="singleInput" class="single-input">
        <label class="panel-label" for="dataInput" data-i18n="report">Report</label>
        <textarea id="dataInput" data-i18n-placeholder="placeholder" placeholder="Cluster 1&#10;Number of voxels: 1842&#10;Peak MNI coordinate: -22 -4 10&#10;…"></textarea>
      </div>
      <div id="splitInput" class="split-input split-only">
        <label class="panel-label">
          xjView
          <textarea id="xjInput" data-i18n-placeholder="placeholder" placeholder="Cluster 1&#10;Number of voxels: …"></textarea>
        </label>
        <label class="panel-label">
          CAT12
          <textarea id="catInput" data-i18n-placeholder="placeholderCat" placeholder="p-value  Cluster-Size  xyz [mm]  …"></textarea>
        </label>
      </div>
      <div class="row">
        <button class="btn btn-primary" type="button" onclick="loadData()" data-i18n="loadData">Load data</button>
        <button class="btn btn-ghost" type="button" onclick="clearAndPaste()" data-i18n="clearPaste">Clear & paste</button>
        <button class="btn btn-text" type="button" onclick="loadSample()" data-i18n="sample">Sample</button>
        <button class="btn btn-text" type="button" onclick="clearAll()" data-i18n="clear">Clear</button>
      </div>
      <label class="check split-only" id="matchXyzRow">
        <input type="checkbox" id="matchXyz" checked onchange="refresh()">
        <span data-i18n="sharedXyz">Matching xyz</span>
      </label>
      <div id="warningMessage" class="note"></div>
    </section>

    <div id="workspace" class="workspace">
      <aside class="options">
        <fieldset class="opt-group xj-only">
          <legend data-i18n="columns">Columns</legend>
          <label class="check"><input type="checkbox" id="firstRegion" onchange="refresh()"> <span data-i18n="firstRegion">First region</span></label>
          <label class="check"><input type="checkbox" id="lastRegion" onchange="refresh()"> <span data-i18n="lastRegion">Last region</span></label>
          <label class="check"><input type="checkbox" id="sortByFirstRegion" onchange="refresh()"> <span data-i18n="sortFirst">Sort by first region</span></label>
          <label class="check"><input type="checkbox" id="highlightDuplicates" onchange="refresh()"> <span data-i18n="highlightDup">Highlight duplicates</span></label>
        </fieldset>
        <fieldset class="opt-group xj-only">
          <legend data-i18n="ignore">Ignore</legend>
          <label class="check"><input type="checkbox" id="ignoreUndefined" onchange="refresh()"> <span data-i18n="ignoreUndefined">Undefined</span></label>
          <label class="check"><input type="checkbox" id="ignoreWhiteMatter" onchange="refresh()"> <span data-i18n="ignoreWm">White matter</span></label>
          <label class="check"><input type="checkbox" id="ignoreGrayMatter" onchange="refresh()"> <span data-i18n="ignoreGm">Gray matter</span></label>
          <label class="check"><input type="checkbox" id="removeAALSuffix" onchange="refresh()"> <span data-i18n="aalSuffix">(aal3v1) suffix</span></label>
        </fieldset>
        <fieldset class="opt-group">
          <legend id="voxelLegend" data-i18n="filterVoxels">Voxels</legend>
          <div class="filter-row">
            <select id="voxelFilterType" onchange="refresh()">
              <option value="greater" data-i18n="greater">Greater than</option>
              <option value="less" data-i18n="less">Less than</option>
            </select>
            <input type="number" id="voxelFilterValue" placeholder="n" oninput="refresh()">
          </div>
        </fieldset>
        <button class="btn btn-ghost xj-only" type="button" onclick="selectAllCheckboxes()" data-i18n="selectAll">Select all</button>
      </aside>

      <div class="stage">
        <div class="tabs" role="tablist">
          <button class="tab" id="tab-general" type="button" role="tab" aria-selected="true" onclick="showSection('general')" data-i18n="general">General</button>
          <button class="tab" id="tab-detail" type="button" role="tab" aria-selected="false" onclick="showSection('detail')" data-i18n="detail">Detail</button>
        </div>
        <div class="meta" id="meta"></div>

        <div id="generalSection">
          <div class="row" style="margin:0 0 10px">
            <button class="btn btn-ghost" type="button" id="exportGeneralCSV" style="display:none" onclick="exportToCSV('general')" data-i18n="exportCsv">Export XLSX</button>
          </div>
          <div id="generalOutput"></div>
        </div>

        <div id="detailSection" style="display:none">
          <div class="detail-bar">
            <select id="clusterSelect" onchange="showDetail()" aria-label="Cluster"></select>
            <button class="btn btn-ghost" type="button" id="exportDetailCSV" style="display:none" onclick="exportToCSV('detail')" data-i18n="exportCsv">Export XLSX</button>
          </div>
          <div id="detailOutput"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="cluster.js"></script>
  <script src="app.js"></script>
</body>
</html>
